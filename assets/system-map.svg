<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
<title id="title">Voldigoade technical system map</title>
<desc id="desc">Animated map of software, system, network and security layers.</desc>
<defs>
  <linearGradient id="flow" x1="0" x2="1">
    <stop offset="0" stop-color="#6e7681"/>
    <stop offset=".52" stop-color="#a371f7"/>
    <stop offset="1" stop-color="#58a6ff"/>
  </linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <style>
    .bg{fill:#0d1117}
    .panel{fill:#161b22;stroke:#30363d;stroke-width:1}
    .label{fill:#8b949e;font:600 12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.8px}
    .title{fill:#f0f6fc;font:600 19px ui-monospace,SFMono-Regular,Consolas,monospace}
    .text{fill:#b1bac4;font:14px ui-monospace,SFMono-Regular,Consolas,monospace}
    .muted{fill:#6e7681;font:12px ui-monospace,SFMono-Regular,Consolas,monospace}
    .route{fill:none;stroke:#30363d;stroke-width:2}
    .flowline{fill:none;stroke:url(#flow);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:9 28;animation:dash 4.8s linear infinite}
    .flow2{animation-duration:6.2s;animation-delay:-1.8s}
    .flow3{animation-duration:7.1s;animation-delay:-3.4s}
    .pulse{fill:#a371f7;filter:url(#soft);opacity:.35;animation:pulse 2.8s ease-in-out infinite}
    .node{fill:#0d1117;stroke:#484f58;stroke-width:1.2}
    .core{fill:#f0f6fc;animation:blink 1.6s steps(1,end) infinite}
    .scan{animation:scan 4s ease-in-out infinite}
    @keyframes dash{to{stroke-dashoffset:-148}}
    @keyframes pulse{0%,100%{opacity:.12;transform:scale(.8)}50%{opacity:.55;transform:scale(1.12)}}
    @keyframes blink{0%,52%{opacity:1}53%,100%{opacity:.18}}
    @keyframes scan{0%,100%{opacity:.2}50%{opacity:.85}}
  </style>
</defs>

<rect class="bg" x="0" y="0" width="1100" height="430" rx="18"/>
<rect x="1" y="1" width="1098" height="428" rx="17" fill="none" stroke="#30363d"/>

<text class="label" x="42" y="42">SYSTEM MAP</text>
<text class="muted" x="935" y="42">profile / 01</text>

<path class="route" d="M136 118 C255 118 273 118 390 118 S564 118 684 118 S838 118 960 118"/>
<path class="route" d="M136 218 C255 218 273 218 390 218 S564 218 684 218 S838 218 960 218"/>
<path class="route" d="M136 318 C255 318 273 318 390 318 S564 318 684 318 S838 318 960 318"/>

<path class="flowline" d="M136 118 C255 118 273 118 390 118 S564 118 684 118 S838 118 960 118"/>
<path class="flowline flow2" d="M136 218 C255 218 273 218 390 218 S564 218 684 218 S838 218 960 218"/>
<path class="flowline flow3" d="M136 318 C255 318 273 318 390 318 S564 318 684 318 S838 318 960 318"/>

<circle class="pulse" cx="136" cy="118" r="18" transform-origin="136px 118px"/>
<circle class="pulse" cx="390" cy="218" r="18" transform-origin="390px 218px" style="animation-delay:.7s"/>
<circle class="pulse" cx="684" cy="318" r="18" transform-origin="684px 318px" style="animation-delay:1.4s"/>

<g transform="translate(48 72)">
  <rect class="panel" width="220" height="94" rx="12"/>
  <text class="label" x="18" y="25">SOFTWARE</text>
  <text class="title" x="18" y="52">Rust · Python</text>
  <text class="text" x="18" y="76">TypeScript · JavaScript</text>
</g>

<g transform="translate(306 72)">
  <rect class="panel" width="220" height="94" rx="12"/>
  <text class="label" x="18" y="25">APPLICATIONS</text>
  <text class="title" x="18" y="52">Tauri · Node</text>
  <text class="text" x="18" y="76">React · Next · APIs</text>
</g>

<g transform="translate(564 72)">
  <rect class="panel" width="220" height="94" rx="12"/>
  <text class="label" x="18" y="25">SYSTEMS</text>
  <text class="title" x="18" y="52">Linux · Unix</text>
  <text class="text" x="18" y="76">Windows · containers</text>
</g>

<g transform="translate(822 72)">
  <rect class="panel" width="230" height="94" rx="12"/>
  <text class="label" x="18" y="25">NETWORK</text>
  <text class="title" x="18" y="52">DNS · routing</text>
  <text class="text" x="18" y="76">VPN · Tor · protocols</text>
</g>

<g transform="translate(48 272)">
  <rect class="panel" width="220" height="94" rx="12"/>
  <text class="label" x="18" y="25">AUTOMATION</text>
  <text class="title" x="18" y="52">scripts · bots</text>
  <text class="text" x="18" y="76">workflows · agents</text>
</g>

<g transform="translate(306 272)">
  <rect class="panel" width="220" height="94" rx="12"/>
  <text class="label" x="18" y="25">DATA</text>
  <text class="title" x="18" y="52">SQLite · local-first</text>
  <text class="text" x="18" y="76">structured data · APIs</text>
</g>

<g transform="translate(564 272)">
  <rect class="panel" width="220" height="94" rx="12"/>
  <text class="label" x="18" y="25">SECURITY</text>
  <text class="title" x="18" y="52">AppSec · OSINT</text>
  <text class="text" x="18" y="76">threat models · tooling</text>
</g>

<g transform="translate(822 272)">
  <rect class="panel" width="230" height="94" rx="12"/>
  <text class="label" x="18" y="25">PRIVACY / RESEARCH</text>
  <text class="title" x="18" y="52">crypto · stego</text>
  <text class="text" x="18" y="76">anonymity · metadata</text>
</g>

<g transform="translate(522 193)">
  <circle class="node" cx="28" cy="28" r="27"/>
  <circle class="core" cx="28" cy="28" r="5"/>
  <text class="muted" x="70" y="24">inspect</text>
  <text class="muted" x="70" y="43">reason</text>
</g>

<rect class="scan" x="48" y="395" width="1004" height="2" rx="1" fill="url(#flow)" opacity=".65"/>
</svg>
