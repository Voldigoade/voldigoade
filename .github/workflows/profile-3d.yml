name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/profile-3d.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Generate profile graphs
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Validate expected graph files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            profile-gitblock.svg \
            profile-green-animate.svg \
            profile-green.svg \
            profile-night-green.svg \
            profile-night-rainbow.svg \
            profile-night-view.svg \
            profile-season-animate.svg \
            profile-season.svg \
            profile-south-season-animate.svg \
            profile-south-season.svg
          do
            test -s "profile-3d-contrib/$file"
          done

      - name: Upload generated profile graphs
        uses: actions/upload-artifact@v4
        with:
          name: profile-3d-contrib
          path: profile-3d-contrib/*.svg
          if-no-files-found: error
          retention-days: 1

  commit:
    if: github.event_name != 'pull_request'
    needs: generate
    runs-on: ubuntu-latest
    name: commit-generated-profile-graphs
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download generated profile graphs
        uses: actions/download-artifact@v4
        with:
          name: profile-3d-contrib
          path: generated

      - name: Copy only expected graph files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p profile-3d-contrib
          for file in \
            profile-gitblock.svg \
            profile-green-animate.svg \
            profile-green.svg \
            profile-night-green.svg \
            profile-night-rainbow.svg \
            profile-night-view.svg \
            profile-season-animate.svg \
            profile-season.svg \
            profile-south-season-animate.svg \
            profile-south-season.svg
          do
            source_path="$(find generated -type f -name "$file" -print -quit)"
            if [[ -z "$source_path" ]]; then
              echo "::error::Expected generated graph $file was not found"
              exit 1
            fi
            cp "$source_path" "profile-3d-contrib/$file"
          done

      - name: Commit and push generated graphs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -- \
            profile-3d-contrib/profile-gitblock.svg \
            profile-3d-contrib/profile-green-animate.svg \
            profile-3d-contrib/profile-green.svg \
            profile-3d-contrib/profile-night-green.svg \
            profile-3d-contrib/profile-night-rainbow.svg \
            profile-3d-contrib/profile-night-view.svg \
            profile-3d-contrib/profile-season-animate.svg \
            profile-3d-contrib/profile-season.svg \
            profile-3d-contrib/profile-south-season-animate.svg \
            profile-3d-contrib/profile-south-season.svg
          if git diff --cached --quiet; then
            echo "No graph changes to commit."
            exit 0
          fi
          git commit -m "generated"
          git push
